name: G.I Manager Android APK
on:
  push:
    branches: [main, gi-redmi9a-ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK and ABI metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          if command -v aapt >/dev/null 2>&1; then aapt dump badging "$APK" | head -n 8; fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GI-Manager-Android-10-ARMv7-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
